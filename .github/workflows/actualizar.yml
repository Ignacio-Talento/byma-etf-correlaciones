name: Actualizar cierre diario

on:
  schedule:
    # Tres pasadas, no por necesidad sino por desconfianza: los cron de Actions
    # llegan tarde o directamente no disparan. El 2026-09-04 la primera no salio
    # y el cierre quedo sin publicar hasta que se lanzo a mano. El script es
    # idempotente en el dato: si el cierre ya esta, la pasada lo reescribe
    # identico. Ojo que igual commitea, porque dataset.json lleva un campo
    # "generado" con la hora al segundo y eso solo ya alcanza para que git vea
    # un cambio. O sea: son ~3 commits por dia, dos de ellos sin dato nuevo.
    #
    # Los minutos son deliberadamente salteados. GitHub encola los cron de toda
    # la plataforma y los que caen en punto o a la media son los mas cargados,
    # que es justo donde se acumula la demora.
    #
    # Los horarios salen de medir cuando Yahoo publica el bar diario, que no
    # es a hora fija. El 2026-09-08 el runner todavia no lo tenia a las 00:28
    # UTC (4h28m despues del cierre) y si a las 05:57; el 2026-09-09 ya estaba
    # a las 23:18 UTC (3h18m). O sea que la demora va de 3 a 10 horas y no
    # depende del tiempo transcurrido. La escalera cubre esa ventana entera.
    #
    # Esto se puede hacer recien ahora: hasta que el pipeline dejo de
    # reescribir el dataset por ruido, cada pasada era un commit. Una pasada
    # que no encuentra nada nuevo ahora no genera ninguno, asi que sobran
    # gratis.
    #
    # 23:31 UTC = 20:31 ART, +3h31m del cierre. Agarra los dias rapidos.
    - cron: "31 23 * * 1-5"
    # 02:19 UTC = 23:19 ART, +6h19m.
    - cron: "19 2 * * 2-6"
    # 06:23 UTC = 03:23 ART, +10h23m. La red de los dias lentos.
    - cron: "23 6 * * 2-6"
    # 16:47 UTC = 13:47 ART del sabado, +20h47m del cierre del viernes.
    #
    # Las tres de arriba son de lunes a viernes, asi que la ultima chance del
    # cierre del viernes era la del sabado a las 03:23. Si Yahoo publicaba
    # despues de esa —y el 2026-09-11 lo hizo entre 5,5 y 11 horas despues del
    # cierre, con el margen justo—, el sitio se quedaba con el jueves hasta el
    # lunes a la noche. Esta cierra el hueco.
    #
    # En sabado no se consulta el panel de BYMA ni se registra liquidez, asi
    # que si Yahoo ya publico esta pasada no encuentra nada y no commitea.
    - cron: "47 16 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-dataset
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Actualizar precios y recalcular
        run: python scripts/actualizar.py --rango 10y

      - name: Backtest walk-forward
        # Los rebalanceos ya calculados salen de data/backtest_pesos.csv, asi
        # que esto solo trabaja cuando aparece un fin de mes nuevo: segundos,
        # no minutos.
        run: python scripts/backtest.py

      - name: Verificar que el cierre sea reciente
        id: check
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import datetime as dt, json, os

          d = json.load(open("docs/data/dataset.json", encoding="utf-8"))
          ultima = dt.date.fromisoformat(d["ultimaRueda"])
          atraso = (dt.date.today() - ultima).days

          print("## Cierre del dataset\n")
          print(f"- Ultima rueda: **{d['ultimaRueda']}** ({atraso} dias de atraso)")
          print(f"- ETFs: {len(d['etfs'])}")
          print(f"- Ruedas publicadas: {len(d['fechas'])}")

          if d.get("avisos"):
              print("\n### Avisos\n")
              for a in d["avisos"]:
                  print(f"- {a}")

          # Un fin de semana largo son 4 dias sin rueda; mas que eso es senal
          # de que la fuente se congelo, no de que el mercado estuvo cerrado.
          if atraso > 4:
              print(f"\n> **El dataset tiene {atraso} dias de atraso.** "
                    "Revisar si Yahoo dejo de responder.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("atrasado=1\n")
          EOF

      - name: Commitear si cambio algo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --staged --quiet; then
            echo "Sin cambios: no se commitea."
          else
            ULT=$(python -c "import json;print(json.load(open('docs/data/dataset.json',encoding='utf-8'))['ultimaRueda'])")
            # El titulo describe lo que entro de verdad: el cierre llega en dos
            # tandas y la primera salia titulada con la rueda anterior (ver
            # scripts/mensaje_commit.py). Es cosmetico, asi que si el script
            # falla se vuelve al titulo de siempre en vez de frenar la
            # publicacion del dato.
            MSG=$(python scripts/mensaje_commit.py) || MSG=""
            [ -n "$MSG" ] || MSG="Cierre $ULT"
            git commit -m "$MSG"
            git push
          fi

      - name: Avisar si el dataset quedo viejo
        if: steps.check.outputs.atrasado == '1'
        run: |
          echo "::warning::El dataset tiene mas de 4 dias de atraso."
